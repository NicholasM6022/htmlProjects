<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Lesson Work</title>
    <style>
        h1, h2
        {
            color: blueviolet;
        }      
        .box > p
        {
            color: firebrick;
        }
        .box li
        {
            color: blue;
        }

        li.done
        {
            color: seagreen;
        }
        ul  p.done
        {
            font-size: 2rem;
        }

        input[checked]
        {
            color:rebeccapurple;
        }
    </style>
</head>
<body>
    <h1>To Do List</h1>
    <h2>Monday</h2>
    <div class="box">
        <p class="done">Do these things today!</p>
        <ul class="list">
            <li>Wash Clothes</li>
            <li class="done">Read</li>
            <li class="done">Math Questions</li>
        </ul>
    </div>
    <ul>
        <p class="done">Other Items</p>
    </ul>
    <p>The best preperation for tomorrow is doing your best today</p>


    <input type="checkbox" id="one" checked>
    <label for="one">One</label>
    <input type="checkbox" id="two" checked>
    <label for="two">Two</label>
    <input type="checkbox" id="three">
    <label for="three">Three</label>
</body>
</html>
