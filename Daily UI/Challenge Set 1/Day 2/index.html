<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gridContainer">
        <div class="flexContainer">
            <label for="name">Name on Card</label>
            <input type="text" id="name">
            <label for="cardNumber">Card Number</label>
            <input type="text" id="cardNumber">
            <div class="security">
                <div>
                    <label for="billZip">Billing Zip</label>
                    <input type="text" id="billZip">
                    
                </div>
                <div>
                    <label for="cvc">Security Number</label>
                    <input type="text" id="cvc"> 
                </div>
            </div>
        </div>

        <div class="billingAddress">
            <label for="addressOne">Address</label>
            <input type="text" id="addressOne">
            <label for="addressTwo">Unit/APT #</label>
            <input type="text" id="addressTwo">
            
            <label for="city">City</label>
            <input type="text" id="city">
            
            <label for="state">State</label>
            <input type="text" id="state">
            <label for="zip">ZIP Code</label>
            <input type="text" id="zip">
            
        </div>
    </div>
    
</body>
</html>
