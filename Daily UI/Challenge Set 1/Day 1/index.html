<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 1</title>
    <style>
        body{
            background-color: rgb(38, 177, 219);
            
        }

        .container{
            display: grid;
            justify-content: center;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(6, 1fr);
        }

        .flexContainer{
            display: flex;
            justify-content: center;
        }

        .pictures{
            height: 400px;
            width: 400px;
            grid-row: span 3;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Trip to Europe</h1>
        <img src="./castle.jpg" class="pictures">

        <h3>Enter to Win a Trip to Europe</h3>
        <img src="./beach.jpg" class="pictures">

        <p>The MindlessMeat foundation offering an all expense paid trip to Europe. The trip is for two 
            weeks to visit castles and sight seeing around.</p>
        
    </div>
    <div class="flexContainer">
        <label for="nameText">Name</label>
        <input type="text" id="nameText">
        <label for="emailText">Email</label>
        <input type="text" id="emailText">
        <button>Submit</button>
    </div>

</body>
</html>
